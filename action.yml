name: GhostCommit
description: Audit a pull request diff for off-spec edits and silent regressions (report only).
branding:
  icon: shield
  color: purple
inputs:
  fail-on:
    description: Fail the job when the Diff Risk Score is >= this value.
    default: "60"
  task:
    description: What the change should do. Defaults to the pull request title.
    default: ""
  upload-sarif:
    description: Upload findings to GitHub code scanning (needs code scanning enabled and security-events write).
    default: "false"
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Audit diff
      shell: bash
      env:
        TASK: ${{ inputs.task || github.event.pull_request.title }}
        BASE: origin/${{ github.base_ref }}
        FAIL_ON: ${{ inputs.fail-on }}
      run: >
        python "$GITHUB_ACTION_PATH/skills/ghostcommit/scripts/audit.py"
        --base "$BASE" --task "$TASK" --fail-on "$FAIL_ON"
        --sarif "$RUNNER_TEMP/ghostcommit.sarif" --verbose
    - name: Upload SARIF
      if: always() && inputs.upload-sarif == 'true' && hashFiles(format('{0}/ghostcommit.sarif', runner.temp)) != ''
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ runner.temp }}/ghostcommit.sarif
